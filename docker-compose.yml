services:
  postgres:
    image: postgres:17-alpine
    container_name: credit-ews-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ews
      POSTGRES_PASSWORD: ews_password
      POSTGRES_DB: credit_ews
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ews -d credit_ews"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: credit-ews-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: